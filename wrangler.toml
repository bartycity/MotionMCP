name = "motion-mcp-server"
# Entry point is the OAuth wrapper (local file, not upstream). It wraps
# upstream's stateless MCP handler; worker.ts's own default export and its
# shared-secret gate are never reached. See src/oauth.ts header.
main = "src/oauth.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

# STAGED RETIREMENT (fork divergence 5). Upstream v2.10.0 removes this binding
# and adds migration tag "v2" with deleted_classes = ["MotionMCPAgent"]. This
# deploy keeps the binding and an inert stub class (src/oauth.ts) so no
# Durable Object migration runs and Cloudflare still allows a rollback to the
# pre-upgrade version. A later, separate deploy removes the binding and stub
# and adds the v2 migration. Do not add it alongside other changes.
[durable_objects]
bindings = [
  { name = "MCP_OBJECT", class_name = "MotionMCPAgent" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MotionMCPAgent"]

[vars]
MOTION_MCP_TOOLS = "complete"

# OAuth token/client storage (workers-oauth-provider). Tokens, codes, and
# client secrets are stored hashed; props encrypted. Created 6 Aug 2026.
[[kv_namespaces]]
binding = "OAUTH_KV"
id = "ad9c31bd548f4f828cf80bc95154c666"

# Secrets set via wrangler:
#   npx wrangler secret put MOTION_API_KEY
#   npx wrangler secret put MOTION_MCP_SECRET   (consent-screen password)

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
invocation_logs = true
