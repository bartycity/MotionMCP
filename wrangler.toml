name = "motion-mcp-server"
# Entry point is the OAuth wrapper (local file, not upstream). It wraps
# upstream's stateless MCP handler; worker.ts's own default export and its
# shared-secret gate are never reached. See src/oauth.ts header.
main = "src/oauth.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

# The MCP transport is stateless (createMcpHandler): no Durable Object is
# bound. The v1 migration created the MotionMCPAgent class for the retired
# McpAgent transport; v2 deletes it (fork divergence 5, Deploy B, 21 Nov 2026).
# Both tags must stay in place so Wrangler can replay the history on a fresh
# deploy. Cloudflare refuses a rollback to any version before the v2 deploy.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["MotionMCPAgent"]

[[migrations]]
tag = "v2"
deleted_classes = ["MotionMCPAgent"]

[vars]
MOTION_MCP_TOOLS = "complete"

# OAuth token/client storage (workers-oauth-provider). Tokens, codes, and
# client secrets are stored hashed; props encrypted. Created 6 Aug 2026.
[[kv_namespaces]]
binding = "OAUTH_KV"
id = "ad9c31bd548f4f828cf80bc95154c666"

# Secrets set via wrangler:
#   npx wrangler secret put MOTION_API_KEY
#   npx wrangler secret put MOTION_MCP_SECRET   (consent-screen password)

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
invocation_logs = true
